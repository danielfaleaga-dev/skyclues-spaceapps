# SkyClues visual identity (see skyclues/theme.py and DESIGN_SYSTEM.md): black and white with a single copper
# accent (the field-of-view ring); rectangular controls with small radii.
[theme]
base = "light"
primaryColor = "#161616"
backgroundColor = "#f7f7f6"
secondaryBackgroundColor = "#eeeeec"
textColor = "#141414"
linkColor = "#141414"
borderColor = "#dcdcda"
dataframeBorderColor = "#dcdcda"
baseRadius = "0.2rem"
showWidgetBorder = true
baseFontSize = 15
# Web fonts (Google Fonts) with system fallbacks: the app stays legible without network access to them.
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, system-ui, 'Segoe UI', sans-serif"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap, system-ui, 'Segoe UI', sans-serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, ui-monospace, Consolas, monospace"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Public visitors never see Python tracebacks, local paths or "Ask ChatGPT" links; the full exception
# still goes to the server log. (Valid values checked against the pinned Streamlit 1.67.0.)
showErrorDetails = "none"
